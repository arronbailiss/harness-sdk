<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" width="720" height="416">
  <!-- Type: Architecture with boundary. Story: every surface reaches one agent through an ingress that authorizes the caller; the agent decides and a separate sandbox does the work. -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head is-accent" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- Zones -->
  <rect class="dg-zone" x="16" y="16" width="176" height="384" rx="8"/>
  <rect class="dg-zone is-boundary" x="384" y="16" width="152" height="384" rx="8"/>
  <rect class="dg-zone is-boundary" x="568" y="16" width="136" height="384" rx="8"/>

  <!-- Zone labels -->
  <text class="dg-eyebrow" x="28" y="36">SURFACES</text>
  <text class="dg-eyebrow" x="396" y="36">AGENT RUNTIME</text>
  <text class="dg-sub" x="396" y="60">models, tokens,</text>
  <text class="dg-sub" x="396" y="76">sessions, no shell</text>
  <text class="dg-eyebrow" x="580" y="36">SANDBOX</text>
  <text class="dg-sub" x="580" y="60">shell and git,</text>
  <text class="dg-sub" x="580" y="76">no secrets</text>

  <!-- Edges -->
  <path class="dg-edge" d="M192,216 H222" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M352,216 H394" marker-end="url(#arrow)"/>
  <path class="dg-edge is-accent" d="M524,216 H578" marker-end="url(#arrow-accent)"/>
  <path class="dg-edge" d="M460,256 V290" marker-end="url(#arrow)"/>

  <!-- Edge labels -->
  <text class="dg-label" x="468" y="277">DELEGATES</text>

  <!-- Nodes -->
  <rect class="dg-node is-input" x="28" y="48" width="152" height="48" rx="6"/>
  <text class="dg-name" x="104" y="69" text-anchor="middle">GitHub</text>
  <text class="dg-sub" x="104" y="87" text-anchor="middle">@mentions, Actions</text>

  <rect class="dg-node is-input" x="28" y="120" width="152" height="48" rx="6"/>
  <text class="dg-name" x="104" y="141" text-anchor="middle">Slack</text>
  <text class="dg-sub" x="104" y="159" text-anchor="middle">DMs and threads</text>

  <rect class="dg-node is-input" x="28" y="192" width="152" height="48" rx="6"/>
  <text class="dg-name" x="104" y="213" text-anchor="middle">Web interface</text>
  <text class="dg-sub" x="104" y="231" text-anchor="middle">desktop and phone</text>

  <rect class="dg-node is-input" x="28" y="264" width="152" height="48" rx="6"/>
  <text class="dg-name" x="104" y="285" text-anchor="middle">CLI, MCP, ACP</text>
  <text class="dg-sub" x="104" y="303" text-anchor="middle">terminal and editors</text>

  <rect class="dg-node is-input" x="28" y="336" width="152" height="48" rx="6"/>
  <text class="dg-name" x="104" y="357" text-anchor="middle">Schedules</text>
  <text class="dg-sub" x="104" y="375" text-anchor="middle">cron, rate, one-off</text>

  <rect class="dg-node" x="224" y="184" width="128" height="64" rx="6"/>
  <text class="dg-name" x="288" y="213" text-anchor="middle">Ingress</text>
  <text class="dg-sub" x="288" y="231" text-anchor="middle">allow-lists</text>

  <rect class="dg-node is-focal" x="396" y="176" width="128" height="80" rx="6"/>
  <text class="dg-name is-focal-text" x="460" y="213" text-anchor="middle">Agent</text>
  <text class="dg-sub" x="460" y="231" text-anchor="middle">decides what to do</text>

  <rect class="dg-node" x="396" y="292" width="128" height="56" rx="6"/>
  <text class="dg-name" x="460" y="317" text-anchor="middle">Subagents</text>
  <text class="dg-sub" x="460" y="335" text-anchor="middle">agent clones</text>

  <rect class="dg-node" x="580" y="184" width="112" height="64" rx="6"/>
  <text class="dg-name" x="636" y="213" text-anchor="middle">Workspace</text>
  <text class="dg-sub" x="636" y="231" text-anchor="middle">per session</text>
</svg>
